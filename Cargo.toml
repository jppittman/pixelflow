[workspace]
members = ["core-term", "pixelflow-core", "pixelflow-graphics", "pixelflow-compiler", "xtask", "pixelflow-runtime", "actor-scheduler", "actor-scheduler-macros", "pixelflow-search", "pixelflow-pipeline", "pixelflow-ml", "pixelflow-ir", "pixelflow-codegen", "desloppify"]
exclude = ["pixelflow-core/fuzz"]
resolver = "2"

# The old opt-level=1/2 workaround for deeply nested expression-template types
# is obsolete. Kernel/ExprArena superseded that layer; see
# docs/language/2026-07-20-kernel-unification.md.
[profile.dev]
opt-level = 0
panic = "abort"

# Workspace-wide lints - prevents swallowing errors with `let _ = `
[workspace.package]
# The never type `!` and the Cargo lint and cooldown settings in this
# workspace are stable as of 1.100.
rust-version = "1.100"

[workspace.lints.rust]
# Treat unused Results as errors - forces explicit handling
unused_must_use = "deny"

[workspace.lints.clippy]
# Catches `let _ = expr` where expr is #[must_use] (Result, etc)
let_underscore_must_use = "deny"
# Warns about functions that should probably be #[must_use]
must_use_candidate = "warn"

[workspace.lints.cargo]
# A dependency nothing uses is a build cost and a supply-chain surface for
# nothing (Rust 1.100). `warn`, not `deny`: a feature-gated dependency used
# only by benches or tests (pixelflow-graphics' `freetype-rs`; Cargo has no
# optional dev-dependencies) is reported by every lib-only check, and an
# exception can't be scoped to one crate under `workspace = true`.
unused_dependencies = "warn"

# Normal release - fast compile, good perf
[profile.release]
opt-level = 3
panic = "abort"

# Benchmark profile - ensure LTO is used
[profile.bench]
lto = true
codegen-units = 1

# Distribution build - maximum optimization, slow compile
# Usage: cargo build --profile dist
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
panic = "abort"
