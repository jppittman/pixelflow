[workspace]
members = ["core-term", "pixelflow-core", "pixelflow-graphics", "pixelflow-compiler", "xtask", "pixelflow-runtime", "actor-scheduler", "actor-scheduler-macros", "pixelflow-search", "pixelflow-pipeline", "pixelflow-ml", "pixelflow-ir", "pixelflow-codegen", "desloppify"]
exclude = ["pixelflow-core/fuzz"]
resolver = "2"

# The old opt-level=1/2 workaround for deeply nested expression-template types
# is obsolete. Kernel/ExprArena superseded that layer; see
# docs/plans/2026-07-20-kernel-unification.md.
[profile.dev]
opt-level = 0
panic = "abort"

# Workspace-wide lints - prevents swallowing errors with `let _ = `
[workspace.lints.rust]
# Treat unused Results as errors - forces explicit handling
unused_must_use = "deny"

[workspace.lints.clippy]
# Catches `let _ = expr` where expr is #[must_use] (Result, etc)
let_underscore_must_use = "deny"
# Warns about functions that should probably be #[must_use]
must_use_candidate = "warn"

# Normal release - fast compile, good perf
[profile.release]
opt-level = 3
panic = "abort"

# Benchmark profile - ensure LTO is used
[profile.bench]
lto = true
codegen-units = 1

# Distribution build - maximum optimization, slow compile
# Usage: cargo build --profile dist
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
panic = "abort"
