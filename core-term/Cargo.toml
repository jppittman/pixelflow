[package]
name = "core-term"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[lints]
workspace = true

[lib]
bench = false

[dependencies]
anyhow = "1.0"
bitflags = { version = "2.9", features = ["serde"] }
env_logger = { version = "0.11", default-features = false, features = ["color"] }
libc = "0.2"
log = "0.4"
nix = { version = "0.30", features = ["term", "process", "fs", "ioctl", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pprof = { version = "0.15", features = ["flamegraph", "criterion"], optional = true }

[dependencies.pixelflow-core]
path = "../pixelflow-core"

[dependencies.pixelflow-graphics]
path = "../pixelflow-graphics"
features = ["serde"]

[dependencies.actor-scheduler]
path = "../actor-scheduler"

# Platform-specific display driver selection
[target.'cfg(target_os = "macos")'.dependencies.pixelflow-runtime]
path = "../pixelflow-runtime"
default-features = false
features = ["display_cocoa"]

[target.'cfg(target_os = "linux")'.dependencies.pixelflow-runtime]
path = "../pixelflow-runtime"
default-features = false
features = ["display_x11"]

[target.'cfg(target_os = "windows")'.dependencies.pixelflow-runtime]
path = "../pixelflow-runtime"
default-features = false
# TODO: Add display_win32 when implemented

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
test-log = "0.2"
rexpect = "0.6"
criterion = "0.5"

[[bench]]
name = "ansi_parser"
harness = false

[[bench]]
name = "keybinding_benchmark"
harness = false

[[bin]]
name = "core-term"
path = "src/main.rs"
bench = false

[features]
# Manual override features (optional - platform auto-detects)
display_cocoa = ["pixelflow-runtime/display_cocoa"]
display_x11 = ["pixelflow-runtime/display_x11"]
default = []
profiling = ["pprof"]
# `cargo run -p core-term --features saturation-telemetry` records every
# e-graph saturation run (macro-tier `kernel!` expansions plus runtime-tier
# glyph/lattice bakes) as JSONL — to `PIXELFLOW_SATURATION_TELEMETRY` if set,
# else stderr. See `pixelflow-search/src/telemetry.rs`.
saturation-telemetry = [
    "pixelflow-core/saturation-telemetry",
    "pixelflow-runtime/saturation-telemetry",
]
