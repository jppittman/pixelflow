[package]
name = "pixelflow-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Procedural macros for PixelFlow: express algebra, get SIMD"
license = "Apache-2.0"

[lib]
proc-macro = true

[features]
# Forwards to `pixelflow-search/saturation-telemetry`: the macro tier's
# `Saturate` pass emits one JSONL saturation record per e-graph run when this
# is on. See `pixelflow-search/src/telemetry.rs` for the record shape and sink.
saturation-telemetry = ["pixelflow-search/saturation-telemetry"]

[dependencies]
syn = { version = "2", features = ["full", "fold", "extra-traits", "parsing"] }
quote = "1"
proc-macro2 = "1"
pixelflow-ir = { path = "../pixelflow-ir" }
pixelflow-search = { path = "../pixelflow-search" }
pixelflow-codegen = { path = "../pixelflow-codegen" }

[dev-dependencies]
pixelflow-core = { path = "../pixelflow-core" }
pixelflow-ir = { path = "../pixelflow-ir" }
