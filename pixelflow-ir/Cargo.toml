[package]
name = "pixelflow-ir"
version = "0.1.0"
edition = "2024"
description = "Unified Intermediate Representation and SIMD Backends for PixelFlow"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[lints]
workspace = true

[dependencies]
libm = "0.2.15"
hashbrown = { version = "0.16", optional = true, default-features = false, features = ["default-hasher"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "dag_vs_arena"
harness = false

[features]
default = ["std", "hash-memo"]
std = []
# `dag::Builder`'s consing memo. Default on: swaps the always-available
# `BTreeMap` fallback (needs only `Ord`, no optional dep — what
# `--no-default-features` gets, since the crate is `no_std`-aspirational
# and can't reach for `std::HashMap` unconditionally) for a `hashbrown`
# `HashMap` (needs `Eq + Hash` instead). See `dag.rs`'s `Memo`/`Key` cfg
# gates — there is no "neither" state to land in by omission.
hash-memo = ["dep:hashbrown"]
