[package]
name = "pixelflow-graphics"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
# The lib's harness is libtest, which rejects Criterion's `--output-format
# bencher`; CI passes that flag to every `--benches` target, so only the
# declared Criterion [[bench]] targets may run as benchmarks.
bench = false

[dependencies]
# Core dependencies
bitflags = "2.9"
log = "0.4"
serde = { version = "1.0", features = ["derive"], optional = true }

# SIMD library for optimized rendering
pixelflow-core = { path = "../pixelflow-core" }
pixelflow-compiler = { path = "../pixelflow-compiler" }
# `kernel!` in `fonts/` expands into code that constructs IR values, so
# this is a real dependency, not just a dev one.
pixelflow-ir = { path = "../pixelflow-ir" }
pixelflow-codegen = { path = "../pixelflow-codegen" }

# Actor system for async rendering
actor-scheduler = { path = "../actor-scheduler" }

# Optional FreeType for benchmarking comparisons
freetype-rs = { version = "0.32", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_Foundation"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.10"
pixelflow-compiler = { path = "../pixelflow-compiler" }
pixelflow-ir = { path = "../pixelflow-ir" }
# The glyph-kernel optimization guards (tests/kernel_glyph_optimize.rs) probe
# the runtime e-graph tier against real curve kernels.
pixelflow-search = { path = "../pixelflow-search" }

[[bench]]
name = "font_rendering"
harness = false

[[bench]]
name = "frame_bake"
harness = false

[features]
default = []
freetype = ["dep:freetype-rs"]
serde = ["dep:serde", "bitflags/serde"]
