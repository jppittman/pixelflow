name: Presubmit Tests

on:
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  # sccache env vars (RUSTC_WRAPPER, CARGO_INCREMENTAL, SCCACHE_GHA_ENABLED)
  # are set per-job below, not here: `dependency-advisories` runs
  # cargo-deny-action inside its own Docker container, which doesn't have
  # sccache installed, and `RUSTC_WRAPPER=sccache` set workflow-wide broke
  # its internal `cargo metadata` (rustc version probe tries to exec a
  # wrapper that doesn't exist in that container). Job-level scoping keeps
  # it opt-in to exactly the jobs that install sccache via
  # mozilla-actions/sccache-action.

# Cancel superseded runs on the same ref so a hung job doesn't linger.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A CL that touches only docs/ and Markdown cannot change what any build or
  # test job would report, so those jobs are skipped for it -- as a job-level
  # `if`, not a workflow-level `paths-ignore`: a job skipped by `if` reports
  # "skipped", which satisfies a required status check, while a workflow that
  # never runs leaves the required checks pending and blocks the merge. The
  # three metadata jobs below run on every CL regardless; they take seconds.
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout code and CL history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the CL by what it touches
        id: scope
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-change-scope.sh "$BASE_COMMIT" "$HEAD_COMMIT"

  cl-metadata:
    name: CL metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and CL history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CL title and commit subjects
        env:
          CL_TITLE: ${{ github.event.pull_request.title }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: >-
          bash scripts/check-cl-metadata.sh
          "$CL_TITLE"
          "$BASE_COMMIT"
          "$HEAD_COMMIT"

  # A build.rs can declare (via rustc-check-cfg) a display-driver cfg that no
  # CI job ever actually builds -- that's exactly how the headless driver
  # went 22-errors-broken with a fully green CI history. This is a fast,
  # blocking metadata check (not a build): it fails the moment a new driver
  # cfg is declared without a maintainer recording how CI covers it, instead
  # of leaving that as a silent gap someone has to rediscover by hand.
  driver-cfg-coverage:
    name: Display driver CI coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check every declared display driver cfg has recorded CI coverage
        run: bash scripts/check-driver-cfg-coverage.sh

  # pixelflow-search's `provenance-journal` feature (the rule-provenance
  # journal: origins, application log, union journal, `derivation_ancestors`,
  # the hindsight labeler) must never reach a downstream `kernel!` consumer's
  # build -- docs/plans/2026-09-01-production-budget-determinism.md. A
  # `cargo build --workspace` unifying it in because pixelflow-pipeline
  # requests it is expected; what must hold is each of these two crates'
  # own `-p`-scoped dependency graph, which is what a real consumer builds.
  provenance-journal-scope:
    name: provenance-journal scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check provenance-journal does not reach pixelflow-compiler or core-term
        run: bash scripts/check-provenance-journal-scope.sh

  dependency-advisories:
    name: Dependency advisories
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Catches known security/soundness advisories (RUSTSEC) in the resolved
      # dependency graph. Config lives in deny.toml; only `advisories` is
      # checked here — see the note at the top of that file for why `bans`,
      # `licenses`, and `sources` aren't gated on yet.
      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  feature-matrix:
    name: Feature matrix
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # Checks every crate against each of its own features in isolation
      # (cargo-hack --each-feature), not just workspace --all-features.
      # Cargo's feature unification can hide a broken feature behind
      # whatever else in the workspace happens to enable its dependencies --
      # see the script's header comment for the pixelflow-graphics `serde`
      # bug this exact gap let through.
      - name: Check every crate's features build in isolation
        run: bash scripts/check-feature-matrix.sh

  fmt:
    name: Rustfmt
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cross-target-abi:
    name: Cross-target ABI (aarch64)
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # This integration target expands the public `kernel!` macro in a
      # consumer crate and bakes what it builds. A host-only proc-macro check
      # would miss generated code that disagrees with the second supported
      # architecture's JIT ABI.
      - name: Type-check the kernel macro on aarch64
        shell: bash
        run: |
          cargo check -p pixelflow-compiler \
            --test bake_vs_scalar_truth \
            --target aarch64-unknown-linux-gnu

  test:
    name: Test on ${{ matrix.os }}
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    # Backstop for non-test hangs (compile / doctests). The precise
    # "no test over 10 minutes" policy is enforced per-test by nextest below.
    timeout-minutes: 30
    strategy:
      # Continue running other jobs even if one fails, to see all failures
      fail-fast: false
      matrix:
        # Test on multiple operating systems
        os: [ubuntu-latest, macos-latest]

    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install X11 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # Compile tests first so the run step below is (mostly) pure execution.
      - name: Build tests
        shell: bash
        run: cargo nextest run --workspace --all-features --no-run

      # Per-test hard cap: nextest TERMINATES any test exceeding 10 minutes and
      # names it in the log (see .config/nextest.toml), failing the run.
      - name: Run workspace tests
        shell: bash
        run: cargo nextest run --workspace --all-features --profile ci

      # nextest does not run doctests; run them separately.
      - name: Run doctests
        shell: bash
        run: cargo test --workspace --all-features --doc

  behavior-contracts:
    name: Behavior contracts
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # These are named public-behavior contracts, not an incidental subset of
      # the workspace suite. nextest's explicit `--no-tests fail` makes deleting
      # or renaming them a hard failure instead of a green zero-test run.
      # Each bakes a `kernel!` body over a one-point lattice and compares it to
      # scalar f32 computed in the test — an oracle outside the compiler, not a
      # second implementation of the same definitions.
      - name: Check baked kernels against scalar truth
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            abs_recip_matches_scalar_truth
            arithmetic_matches_scalar_truth
            params_match_scalar_truth
            piecewise_matches_scalar_truth
            projections_are_the_symbolic_derivative
          )
          for test_name in "${tests[@]}"; do
            cargo nextest run -p pixelflow-compiler \
              --test bake_vs_scalar_truth \
              -E "test(=$test_name)" \
              --no-tests fail
          done

      - name: Check JIT/interpreter glyph parity
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            descender_glyph_bake_matches_interpreter
            double_counter_glyph_bake_matches_interpreter
            round_glyph_bake_matches_interpreter
            simple_glyph_bake_matches_interpreter
          )
          for test_name in "${tests[@]}"; do
            cargo nextest run -p pixelflow-graphics \
              --test kernel_glyph_golden \
              -E "test(=$test_name)" \
              --no-tests fail
          done

      - name: Check scene color, reflection, and antialiasing contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            color_chrome_sphere
            floor_only
            four_channels_share_one_geometry
          )
          for test_name in "${tests[@]}"; do
            cargo nextest run -p pixelflow-graphics \
              --test scene3d_test \
              -E "test(=$test_name)" \
              --profile ci \
              --no-tests fail
          done

      - name: Check ray/surface composition contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            chrome_sphere_on_checkerboard
            sphere_on_floor
            sphere_on_matte_floor
          )
          for test_name in "${tests[@]}"; do
            cargo nextest run -p pixelflow-graphics \
              --test raymarch_sphere \
              -E "test(=$test_name)" \
              --profile ci \
              --no-tests fail
          done

  isa-matrix:
    name: ISA matrix (SSE2/AVX2/AVX-512)
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Build+lint every supported ISA level, then RUN the two crates whose
    # output is per-level machine code (`--smoke`). Building the test binaries
    # already happens for `--no-run` and clippy, so executing that subset is
    # marginal cost only -- ~50s per level against ~344s for the whole
    # workspace -- which is what makes a real per-level *execution* signal
    # affordable presubmit rather than postsubmit-only.
    #
    # It is a fraction, deliberately: the rest of the workspace consumes the
    # same kernels through the same interface at every level, so running it
    # three times re-runs identical work. Postsubmit still runs the full
    # workspace per level (see postsubmit-flake-detection.yaml) -- this catches
    # the level-specific miscompiles early, not all of them.
    timeout-minutes: 25
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # .cargo/config.toml sets no target-cpu/target-feature, so the jobs
      # above only ever exercise whichever ISA level SSE2-baseline codegen
      # happens to be. This builds + lints again under +avx2,+fma and
      # +avx512f, and runs the codegen/IR suites for whichever of those the
      # runner's CPU can actually execute. A level the hardware can't run is
      # still built and linted, and the summary says so per level -- a skip
      # that is stated, never silent. See `xtask isa-matrix`'s own doc comment
      # for the per-level detection and for what `--smoke` covers.
      - name: Run ISA matrix (build + clippy + smoke tests per level)
        shell: bash
        run: cargo run -p xtask -- isa-matrix --clippy --smoke

  # The `test` job above runs `cargo test` on macos-latest, but that never
  # exercises a real LaunchServices bundle launch -- `cargo run`/`cargo test`
  # spawn the binary directly, bypassing the app-bundle launch path entirely.
  # A prior bug (background threads calling into AppKit unsynchronized with
  # MetalOps's hand-pumped event queue, fixed via CocoaWaker's dispatch_async
  # hop onto the main thread -- see pixelflow-runtime/src/platform/waker.rs)
  # crashed ~2 out of 3 raw launches, 14-22s after startup, and was invisible
  # to every job above: Linux runners have no window server at all, and even
  # on macOS, only a real `open`/LaunchServices launch reproduced it. This
  # job is what would have caught it, and is what stops it from silently
  # coming back.
  macos-launch-stability:
    # Informational while the harness is tuned against real runner timing —
    # same policy as the WASM status job: keep the signal, don't gate merges
    # on an unproven check. Flip to blocking once it has a green history.
    name: macOS launch stability (informational, non-blocking)
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The app's font is LFS-tracked (.gitattributes), and this is the
          # only job that runs the real bundle — without the smudge it ships
          # a 131-byte pointer and the app dies parsing it. Tests escape this
          # by include_bytes!-ing the fallback font, which .gitattributes
          # exempts from LFS for exactly that reason.
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Launch the bundled app repeatedly and check for crash reports
        run: cargo run -p xtask --release -- launch-stability-check

      # The stability check above already fails the job on a crash; this
      # step exists purely to attach the .ips content to the log so a
      # failure is diagnosable without re-running locally.
      - name: Dump any crash reports (only runs if a launch crashed)
        if: failure()
        run: |
          shopt -s nullglob
          for f in "$HOME/Library/Logs/DiagnosticReports"/CoreTerm-*.ips; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  # Every display driver's cfg (use_cocoa_display, use_x11_display,
  # use_web_display) should be verifiably exercised *somewhere* in CI, or its
  # buildability is a total blind spot -- exactly how the now-deleted headless
  # driver went 22-errors-broken without a single red check. Cocoa/X11 are
  # covered by the `test`/`clippy` jobs above (build.rs's target_os priority
  # always resolves to one of them there). Nothing above ever targets wasm32,
  # so use_web_display has never been compiled by CI at all.
  #
  # This job is deliberately non-blocking: pixelflow-ir's `backend::emit`
  # module (the JIT machine-code emitter) is compiled unconditionally --  not
  # feature- or arch-gated -- and only has x86_64/aarch64 constants defined,
  # so every crate in this dependency chain (pixelflow-ir -> pixelflow-search
  # -> pixelflow-core -> pixelflow-runtime) currently fails to build for
  # wasm32. All three checks below are expected to be RED today. That's a
  # real, substantial gap (a wasm32 JIT backend does not exist), not a
  # regression this job should gate merges on. Its purpose is to keep that
  # gap *visible and tracked* instead of silently unreachable by any check,
  # so the day someone starts fixing it, this job is what turns green and
  # proves it -- and so nobody has to rediscover this by hand.
  wasm32-status:
    name: WASM target status (informational, non-blocking)
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # Reported separately (not one `cargo check --workspace`) so the log
      # says exactly which crates build for wasm32 today and which don't,
      # instead of one pass/fail bit for the whole dependency graph.
      - name: Check wasm32 buildability per crate
        shell: bash
        run: |
          set -uo pipefail
          check() {
            local label=$1
            shift
            echo "::group::$label"
            if cargo check --target wasm32-unknown-unknown "$@"; then
              echo "PASS: $label"
            else
              echo "::warning::FAIL (known, tracked): $label does not build for wasm32-unknown-unknown"
            fi
            echo "::endgroup::"
          }
          check "pixelflow-search" -p pixelflow-search
          check "pixelflow-core" -p pixelflow-core
          check "pixelflow-runtime web driver" -p pixelflow-runtime --no-default-features --features display_web
        env:
          DISPLAY_DRIVER: web

  # `pixelflow-ir` compiles with `std` off. That is a real guarantee now, not
  # an aspiration, so it is enforced rather than reported: the crate is the
  # bootloader target's floor, and it regresses silently otherwise (a stray
  # `format!` compiles fine in every other job, because workspace-wide
  # `--all-features`/`--workspace` runs unify features across crates instead of
  # checking each in isolation).
  #
  # It got there on 2026-08-02 from 220 errors. Most were two missing
  # `use alloc::vec::Vec;` lines; the rest were `format!`/`String`/`vec!`
  # imports and seven `f32` inherent methods routed through the `libm`
  # dependency the crate already carried.
  #
  # `pixelflow-search --no-default-features` is checked here too. It used to
  # gate the NNUE weights opt-in behind a `std` feature (2026-08-30); that
  # opt-in and the feature were deleted with the extraction-head program on
  # 2026-09-01, so the crate now has no Cargo features and this step proves
  # only that it builds with none requested.
  #
  # Unlike the pixelflow-ir check above, this is not a no_std guarantee:
  # pixelflow-search's `lib.rs` never applies `#![no_std]`, `egraph/graph.rs`
  # and `egraph/cost.rs` use `std::` unconditionally, and this crate's own
  # Cargo.toml hard-forces its `pixelflow-ir` dependency's `std` feature on.
  # Making pixelflow-search genuinely no_std is separate, larger work.
  no-std:
    name: pixelflow-ir no_std + pixelflow-search std-feature-off builds
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # `-D warnings` because an unused `alloc` import is exactly the shape of
      # the regression this job exists to catch.
      - name: cargo check -p pixelflow-ir --no-default-features
        run: cargo check -p pixelflow-ir --no-default-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: cargo check -p pixelflow-search --no-default-features
        run: cargo check -p pixelflow-search --no-default-features
