name: Postsubmit Flake Detection

on:
  push:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.test-suite }} on ${{ matrix.os }} (5 iterations)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # See rust.yaml's env block for why this is job-level, not workflow-level:
    # sccache shares compiled objects by content hash across jobs and even
    # across workflow files (GHA cache backend is repo-scoped), so a commit
    # already built by presubmit is nearly free to rebuild here — but only
    # jobs that actually install sccache (below) may set these, or any job
    # invoking cargo/rustc in an environment without it (e.g. inside another
    # action's own container) breaks trying to exec a wrapper that isn't
    # there.
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      # A cache-service error must degrade to no cache, not fail the job (docs/BACKLOG.md, "Correctness and CI", C6):
      # SCCACHE_SKIP_CACHE_CHECK covers the server's eager startup probe of the GHA backend (the `rustc -vV` incident's path); SCCACHE_IGNORE_SERVER_IO_ERROR covers a running server losing the cache mid-job.
      SCCACHE_SKIP_CACHE_CHECK: "1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    strategy:
      # A failure in one suite must not hide results from the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        test-suite: [actor-scheduler, other-crates]
        include:
          - test-suite: actor-scheduler
            cargo-args: "-p actor-scheduler -p actor-scheduler-macros"
          - test-suite: other-crates
            cargo-args: "--workspace --exclude actor-scheduler --exclude actor-scheduler-macros"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install X11 dependencies (Linux)
        if: runner.os == 'Linux' && matrix.test-suite == 'other-crates'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      # A build failure is a hard postsubmit failure in its own right; keeping
      # it a separate step also means the iteration loop below measures test
      # stability, not compilation.
      - name: Build tests
        shell: bash
        run: cargo nextest run ${{ matrix.cargo-args }} --no-run

      # Run the suite 5 times to separate flaky tests from broken ones:
      #   5/5 pass  -> green
      #   1-4 fail  -> FLAKY: reported as an issue by the flake-report job,
      #                but the workflow stays green (no revert for flakes)
      #   5/5 fail  -> consistent failure: job fails, which fails the
      #                workflow and triggers the automatic revert
      - name: Run test suite 5 times
        shell: bash
        run: |
          set -o pipefail
          PASSES=0
          : > failed_tests.txt
          for i in 1 2 3 4 5; do
            echo "::group::Iteration $i/5"
            if cargo nextest run ${{ matrix.cargo-args }} --profile ci 2>&1 | tee "run_$i.log"; then
              PASSES=$((PASSES + 1))
            else
              # Per-test timeouts (.config/nextest.toml) surface as TIMEOUT.
              grep -E '^[[:space:]]+(FAIL|TIMEOUT|SIGSEGV|SIGABRT|ABORT)' "run_$i.log" >> failed_tests.txt || true
            fi
            echo "::endgroup::"
          done

          SLUG="${{ matrix.os }}-${{ matrix.test-suite }}"
          echo "$SLUG: $PASSES/5 iterations passed"
          if [ "$PASSES" -eq 5 ]; then
            exit 0
          elif [ "$PASSES" -eq 0 ]; then
            echo "::error::$SLUG: all 5 iterations failed — consistent breakage, revert will be proposed"
            exit 1
          fi

          echo "::warning::$SLUG: $((5 - PASSES))/5 iterations failed — flaky, filing an issue instead of reverting"
          mkdir -p flake-results
          {
            echo "### \`$SLUG\`: $((5 - PASSES))/5 iterations failed"
            echo ""
            echo '```'
            sort -u failed_tests.txt
            echo '```'
          } > "flake-results/$SLUG.md"

      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-${{ matrix.os }}-${{ matrix.test-suite }}
          path: flake-results/
          if-no-files-found: ignore

  # Single-run build+lint+test pass per x86-64 ISA level (SSE2/AVX2/AVX-512).
  # Presubmit (rust.yaml) already built+linted every level with
  # `--build-only`; this is the actual execution pass, deferred here because
  # it's the slow part (four full test runs, one per ISA_LEVELS entry) and a
  # bad result now means reverting the already-merged commit, not blocking a
  # PR. No flake-retry loop like the `test` job above: a failure here is a
  # genuine ISA-level break, and a flaky failure is exactly as real a break as
  # a consistent one -- it fails this job outright, which fails the workflow
  # and triggers the automatic revert.
  isa-matrix:
    name: ISA matrix (SSE2/AVX2/AVX-512) -- build+lint+test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      # A cache-service error must degrade to no cache, not fail the job (docs/BACKLOG.md, "Correctness and CI", C6):
      # SCCACHE_SKIP_CACHE_CHECK covers the server's eager startup probe of the GHA backend (the `rustc -vV` incident's path); SCCACHE_IGNORE_SERVER_IO_ERROR covers a running server losing the cache mid-job.
      SCCACHE_SKIP_CACHE_CHECK: "1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Run ISA matrix (test + clippy per supported level)
        shell: bash
        run: cargo run -p xtask -- isa-matrix --clippy

  # Files (or updates) a tracking issue when any suite was flaky. This job
  # must never fail the workflow: a hiccup filing an issue is not a
  # postsubmit failure and must not trigger the automatic revert. It still
  # needs isa-matrix's result (not its artifacts -- that job produces none):
  # isa-matrix fails the *workflow* outright on any test failure, so a flake
  # here and an isa-matrix failure can land on the same commit, and the issue
  # body must not claim "not reverted" when isa-matrix is exactly why it was.
  flake-report:
    name: File flake report
    runs-on: ubuntu-latest
    needs: [test, isa-matrix]
    if: always()
    continue-on-error: true
    permissions:
      issues: write
    steps:
      - name: Download flake reports
        uses: actions/download-artifact@v4
        with:
          pattern: flake-*
          merge-multiple: true
          path: flake-results

      - name: Create or update flake issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISA_MATRIX_RESULT: ${{ needs.isa-matrix.result }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(flake-results/*.md)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No flaky suites detected."
            exit 0
          fi

          gh label create "flaky-test" -f \
            --color "FBCA04" --description "Test failed intermittently in postsubmit" \
            --repo "${{ github.repository }}"

          if [ "$ISA_MATRIX_RESULT" = "failure" ]; then
            DISPOSITION="The \`isa-matrix\` job also failed on this commit, separately from the flake below (it does not retry -- any ISA-level failure is treated as a real break). That failure, not the flake, is what makes the overall workflow conclude failure and triggers \`automatic-revert.yaml\` to propose a revert PR. Deflake or quarantine the flaky tests below regardless."
          else
            DISPOSITION="A flaky suite passed some of its 5 postsubmit iterations and failed others, so the commit was **not** reverted. Deflake or quarantine the tests below."
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Intermittent test failures detected on \`${{ github.sha }}\` ([run]($RUN_URL)).

          $DISPOSITION

          $(cat "${reports[@]}")"

          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label flaky-test --state open \
            --search "Flaky tests detected on main in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Flaky tests detected on main" \
              --body "$BODY" \
              --label "flaky-test"
          fi
