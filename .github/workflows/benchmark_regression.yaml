name: Benchmark Regression Check

on:
  push:
    branches: [ "main" ]

# Benchmarks are postsubmit-only (docs/POSTSUBMIT.md). A presubmit copy was
# tried and removed: one hosted-runner sample against a single baseline point
# alerts on noisy neighbors as readily as on code, and a check that fails for
# reasons the author cannot act on is one that gets ignored. Attribution to a
# specific commit, plus the issue trail, is what makes the signal actionable —
# and that only exists once the commit is on main.

# No workflow-level permissions: the job below declares exactly what it holds.
# It publishes the baseline to gh-pages and files regression issues, so it
# holds writes.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Pushes to main: advance the baseline, attribute regressions ──────────
  #
  # Baselines must land in commit order: never run two baseline updates at
  # once, and never skip a commit (skipping would attribute a regression to
  # the wrong commit).
  baseline:
    runs-on: ubuntu-latest
    permissions:
      # Push the baseline to gh-pages and comment on regressing commits.
      contents: write
      # Open/append the regression-tracking issue.
      issues: write
    concurrency:
      group: benchmark-baseline
      cancel-in-progress: false
    timeout-minutes: 90
    # See rust.yaml's env block for why this is job-level, not workflow-level.
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      # Degrade to no cache instead of failing the job on a cache-service
      # error (docs/BACKLOG.md, "Correctness and CI", C6).
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # ratchet:mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Run benchmarks
        run: |
          set -o pipefail
          mkdir -p benchmark_results
          cargo bench --workspace --benches -- --output-format bencher | tee benchmark_results/output.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results/output.txt
          if-no-files-found: error

      # github-action-benchmark's auto-push does `git fetch origin
      # gh-pages:gh-pages` and fails outright if the branch has never been
      # created. Bootstrap an empty orphan branch on first run only.
      - name: Ensure gh-pages branch exists
        run: |
          set -euo pipefail
          # Only "no matching ref" (status 2) may trigger a bootstrap;
          # bootstrapping on a transport error would race a branch that
          # actually exists.
          status=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "gh-pages already exists"
            exit 0
          elif [ "$status" -ne 2 ]; then
            echo "::error::git ls-remote failed with status $status (not 'ref absent')"
            exit "$status"
          fi
          git config user.name "github-action-benchmark"
          git config user.email "github@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          git commit --allow-empty -m "Initialize gh-pages branch"
          git push origin gh-pages:gh-pages
          git checkout -

      - name: Compare against baseline and publish
        id: benchmark_check
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: benchmark_results/output.txt
          gh-pages-branch: gh-pages
          alert-threshold: '125%'
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Commit-level attribution on the regressing main commit
          # (docs/POSTSUBMIT.md) — the tracking issue below is in addition,
          # not instead.
          comment-on-alert: true
          summary-always: true

      - name: Open performance regression issue
        if: failure() && steps.benchmark_check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create "performance-regression" -f \
            --color "D93F0B" --description "Postsubmit benchmark regression"

          AUTHOR=$(git log -1 --pretty=format:'%an')
          SHA=$(git rev-parse --short HEAD)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="### Benchmark regression report

          **Commit:** $SHA
          **Author:** $AUTHOR

          One or more benchmarks regressed by more than **25%** against the previous baseline.

          [View benchmark logs]($RUN_URL)

          If the slowdown is expected (e.g. an intentional trade), close this issue with a note; otherwise fix or revert."

          # One open issue at a time: pile new reports onto the existing one
          # instead of spamming a fresh issue per commit.
          EXISTING=$(gh issue list --label performance-regression --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Performance regression detected on main ($SHA)" \
              --body "$BODY" \
              --label "performance-regression"
          fi
