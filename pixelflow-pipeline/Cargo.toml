[package]
name = "pixelflow-pipeline"
version = "0.1.0"
edition = "2024"
description = "Training and data generation pipeline for PixelFlow"

[lib]
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

[features]
default = ["training"]
training = []
profiling = ["pprof"]

[dependencies]
pixelflow-codegen = { path = "../pixelflow-codegen" }
pixelflow-ir = { path = "../pixelflow-ir" }
# `provenance-journal` unconditional (not gated behind `training`): the
# hindsight labeler and guided-saturation harnesses (`guide_headroom`,
# `guide_scope_saturation_delta`) read `Provenance::origins`/`applications`/
# `derivation_ancestors` directly, and those APIs do not exist in
# pixelflow-search without the feature.
pixelflow-search = { path = "../pixelflow-search", features = ["provenance-journal"] }
pixelflow-core = { path = "../pixelflow-core" }
# The collapse-cost corpus is led by the glyph kernels core-term bakes, and
# `collapse_cost capture` builds them through the same `Font`/`GlyphAtlas`
# production does — so the fixture is production's kernels, not a restatement
# of their arithmetic.
pixelflow-graphics = { path = "../pixelflow-graphics" }
libm = "0.2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
criterion = "0.5"
libc = "0.2.183"
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

[dev-dependencies]
criterion = "0.5"
pixelflow-ir = { path = "../pixelflow-ir" }

[[bin]]
name = "collapse_cost"
path = "src/bin/collapse_cost.rs"
# libtest harness rejects Criterion's bencher flags under `cargo bench --benches`.
bench = false

