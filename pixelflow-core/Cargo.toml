[package]
name = "pixelflow-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
bench = false

[features]
# Forwards to `pixelflow-codegen`, the one crate that invokes saturation on
# this crate's behalf (`Manifold::compile` -> `jit_cache` ->
# `optimize_runtime_arena`). See `pixelflow-search/src/telemetry.rs`.
saturation-telemetry = ["pixelflow-codegen/saturation-telemetry"]

[dependencies]
pixelflow-ir = { path = "../pixelflow-ir" }
pixelflow-codegen = { path = "../pixelflow-codegen" }

[dev-dependencies]
pixelflow-ir = { path = "../pixelflow-ir" }
